version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xyzl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Mysql@123456}
      MYSQL_DATABASE: ${DB_NAME:-xyzl_db}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"
    networks:
      - xyzl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Mysql@123456}"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xyzl-backend
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Mysql@123456}
      DB_NAME: ${DB_NAME:-xyzl_db}
      DB_PORT: 3306
      PORT: 3001
      NODE_ENV: production
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - xyzl-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: xyzl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - xyzl-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  xyzl-network:
    driver: bridge
